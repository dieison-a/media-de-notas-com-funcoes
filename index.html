<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Média de notas</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="card">
        <h1>Cálculo de média</h1>

        <form action="main.php" method="post">
            <label for="nota1">Primeira nota:</label>
            <input type="number" name="nota1" id="nota1" min="0" max="10" step="0.1" required />

            <label for="nota2">Segunda nota:</label>
            <input type="number" name="nota2" id="nota2" min="0" max="10" step="0.1" required />

            <label for="nota3">Terceira nota:</label>
            <input type="number" name="nota3" id="nota3" min="0" max="10" step="0.1" required />

            <p>Tipo de média:</p>
            <label><input type="radio" name="tipoMedia" value="aritmetica" checked /> Média aritmética simples</label>
            <label><input type="radio" name="tipoMedia" value="ponderada" /> Média ponderada</label>

            <button type="submit">Calcular</button>
            <button type="reset">Limpar</button>
        </form>
    </main>
</body>

</html>
